name: Build v2 clients

on:
  push:
    branches:
      - agent/itch-v2.0.0
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify shared engine and build clients
        run: >-
          ./gradlew --stacktrace
          architekturPruefen
          :core:domain:jvmTest
          :core:application:jvmTest
          :apps:web:jsBrowserTest
          :apps:web:jsBrowserProductionWebpack
          :apps:android:assembleDebug

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: fiatstandard-web-production
          path: apps/web/build/dist/js/productionExecutable
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fiatstandard-android-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
