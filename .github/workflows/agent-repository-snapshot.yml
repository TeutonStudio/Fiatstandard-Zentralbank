name: Agent repository snapshot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-agent-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/itch-v2.0.0
          fetch-depth: 0
      - name: Apply staged source archive
        id: apply
        shell: bash
        run: |
          set +e
          (
            set -ex
            rm -rf /tmp/agent-change
            mkdir -p /tmp/agent-change
            {
              head -c 6000 .github/agent/changes/05/part-00
              head -c 3000 .github/agent/changes/05/part-01a
              head -c 3000 .github/agent/changes/05/part-01b
              head -c 6000 .github/agent/changes/05/part-02
              head -c 6000 .github/agent/changes/05/part-03
              head -c 6000 .github/agent/changes/05/part-04
              head -c 6000 .github/agent/changes/05/part-05
              head -c 546 .github/agent/changes/05/part-06a
              head -c 546 .github/agent/changes/05/part-06b
            } | base64 --decode > /tmp/agent-change.tar.gz
            actual_hash="$(sha256sum /tmp/agent-change.tar.gz | cut -d' ' -f1)"
            test "$actual_hash" = "9a2027c343a4c1460bf1f499b3c34132d7fb42a3bee004c8682eaf203b7b6e72"
            tar -xzf /tmp/agent-change.tar.gz -C /tmp/agent-change
            cp -a /tmp/agent-change/tree/. .
            while IFS= read -r path; do
              [ -z "$path" ] || git add -A -- "$path"
            done < /tmp/agent-change/meta/files
            while IFS= read -r path; do
              [ -z "$path" ] || { rm -rf -- "$path"; git add -A -- "$path"; }
            done < /tmp/agent-change/meta/deletions
            if git diff --cached --quiet; then
              echo "Keine neuen Quelländerungen anzuwenden."
              exit 0
            fi
            git config user.name "OpenAI Codex"
            git config user.email "codex@openai.com"
            git commit -F /tmp/agent-change/meta/message
            git push origin HEAD:refs/heads/agent/itch-v2.0.0
          ) > apply.log 2>&1
          status=$?
          cat apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload apply log
        uses: actions/upload-artifact@v4
        with:
          name: source-apply-log
          path: apply.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when apply failed
        if: steps.apply.outputs.status != '0'
        run: exit 1
