name: Agent repository snapshot

on:
  push:
    branches:
      - agent/itch-v2.0.0
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive and Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle create repository.bundle --all
          git archive --format=tar.gz --output=repository-source.tar.gz HEAD
          git rev-parse HEAD > snapshot-head.txt
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: |
            repository.bundle
            repository-source.tar.gz
            snapshot-head.txt
          if-no-files-found: error
          retention-days: 1
